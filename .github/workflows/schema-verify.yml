# ==============================================================================
# 真库回放校验（卡 G-0 起常驻）：MySQL 8 容器里重放建库脚本，断言表/外键/种子
# ------------------------------------------------------------------------------
# 两条路径都要过：
#   A 全新安装：01-schema.sql 直接重放（模拟数据卷为空的首启）；
#   B 存量升级：基线分支的 init SQL 建出旧库，再依序回放 migrations/*.sql
#     （模拟线上库升级；用 -f 跳过「已迁移过」的重复约束报错——那是 20261103-01
#       头注释里约定的一次性脚本特性，非真错误）。
# 触发：deploy/mysql/**、schema.prisma 或本文件变动的 PR。
# ==============================================================================

name: schema-verify

on:
  pull_request:
    paths:
      - 'deploy/mysql/**'
      - 'backend/prisma/schema.prisma'
      - '.github/workflows/schema-verify.yml'
  workflow_dispatch:

jobs:
  replay:
    name: 真库回放校验（G-0）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_PWD: root

    steps:
      - name: 检出代码（含基线分支历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 路径A 全新安装——重放 01-schema.sql
        run: mysql -h127.0.0.1 -uroot < deploy/mysql/init/01-schema.sql

      - name: 断言A——表数/外键数/标签种子/枚举注释
        run: |
          q() { mysql -h127.0.0.1 -uroot -N -e "$1"; }
          check() { # 期望值 实际值 说明
            [ "$2" = "$1" ] || { echo "::error::$3 期望 $1 实际 $2"; exit 1; }
          }
          check 24 "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='se2026'")" "全库表数"
          check 39 "$(q "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='se2026'")" "外键总数"
          check 8  "$(q "SELECT COUNT(*) FROM se2026.community_tag WHERE deleted=0")" "标签字典种子"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='conversation' AND column_name='type' AND column_comment LIKE '%meeting%'")" "conversation.type 含 meeting"
          # 线③ 收尾：message 表新增 file_id（文件消息附件落点）
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name='file_id'")" "message.file_id 列存在"
          check 1  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='message' AND index_name='idx_message_file'")" "idx_message_file 索引存在"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='se2026' AND constraint_name='message_file_id_fkey'")" "message_file_id_fkey 外键存在"
          # 升级终态与全新安装同构：file_id 上只留 idx_message_file 一个索引（外键直接复用它）；
          # content 的注释由迁移脚本的 MODIFY COLUMN 同步。只数「存在」拦不住多建或漏建，这里数总数
          check 4  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='message'")" "message 表索引个数"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name='content' AND column_comment LIKE '%file%'")" "message.content 列注释"
          # 线③ 卡 E-3：user 表新增 3 列（public_uid/bio/profile_visibility）
          check 3  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user' AND column_name IN ('public_uid','bio','profile_visibility')")" "user 表线③新增列数"
          check 12 "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user'")" "user 表总列数"
          check 1  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='user' AND index_name='uk_user_public_uid'")" "uk_user_public_uid 唯一索引存在"
          # 列顺序（迁移脚本用 AFTER msg_type 保证与全新安装同构）
          check "content msg_type file_id ref_type" \
            "$(q "SELECT GROUP_CONCAT(column_name ORDER BY ordinal_position SEPARATOR ' ') FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name IN ('content','msg_type','file_id','ref_type')")" \
            "message 表列顺序"
          # 列顺序（迁移脚本用 AFTER 保证与全新安装同构，见评审意见 B2②）
          check "email public_uid bio profile_visibility created_at" \
            "$(q "SELECT GROUP_CONCAT(column_name ORDER BY ordinal_position SEPARATOR ' ') FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user' AND column_name IN ('email','public_uid','bio','profile_visibility','created_at')")" \
            "user 表列顺序"
          echo "PATH_A_OK 全新安装路径通过"

      - name: 路径B 存量升级——基线 init SQL + 依序回放 migrations
        run: |
          git show origin/develop:deploy/mysql/init/01-schema.sql > /tmp/base.sql
          mysql -h127.0.0.1 -uroot -e 'DROP DATABASE `se2026`'
          mysql -h127.0.0.1 -uroot < /tmp/base.sql
          echo "基线表数: $(mysql -h127.0.0.1 -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='se2026'")"
          for f in deploy/mysql/migrations/*.sql; do
            echo ">> 回放 $f"
            # 迁移脚本按 20261103-01 惯例不带 USE（部署时库名按需替换），这里显式指定库
            mysql -h127.0.0.1 -uroot -f se2026 < "$f"
          done

      - name: 断言B——升级终态与全新安装同构
        run: |
          q() { mysql -h127.0.0.1 -uroot -N -e "$1"; }
          check() { [ "$2" = "$1" ] || { echo "::error::$3 期望 $1 实际 $2"; exit 1; }; }
          check 24 "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='se2026'")" "全库表数"
          check 39 "$(q "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='se2026'")" "外键总数"
          check 8  "$(q "SELECT COUNT(*) FROM se2026.community_tag WHERE deleted=0")" "标签字典种子"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='conversation' AND column_name='type' AND column_comment LIKE '%meeting%'")" "conversation.type 含 meeting"
          # 线③ 收尾：message 表新增 file_id（文件消息附件落点）
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name='file_id'")" "message.file_id 列存在"
          check 1  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='message' AND index_name='idx_message_file'")" "idx_message_file 索引存在"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema='se2026' AND constraint_name='message_file_id_fkey'")" "message_file_id_fkey 外键存在"
          # 同上：升级路径也断言索引总数与 content 注释，两条路径终态一致
          check 4  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='message'")" "message 表索引个数"
          check 1  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name='content' AND column_comment LIKE '%file%'")" "message.content 列注释"
          # 线③ 卡 E-3：迁移后 user 表必须与全新安装同构
          check 3  "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user' AND column_name IN ('public_uid','bio','profile_visibility')")" "user 表线③新增列数"
          check 12 "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user'")" "user 表总列数"
          check 1  "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='se2026' AND table_name='user' AND index_name='uk_user_public_uid'")" "uk_user_public_uid 唯一索引存在"
          # 列顺序（迁移脚本用 AFTER msg_type 保证与全新安装同构）
          check "content msg_type file_id ref_type" \
            "$(q "SELECT GROUP_CONCAT(column_name ORDER BY ordinal_position SEPARATOR ' ') FROM information_schema.columns WHERE table_schema='se2026' AND table_name='message' AND column_name IN ('content','msg_type','file_id','ref_type')")" \
            "message 表列顺序"
          # 列顺序必须与全新安装一致（迁移脚本用 AFTER email 保证，见评审意见 B2②）
          check "email public_uid bio profile_visibility created_at" \
            "$(q "SELECT GROUP_CONCAT(column_name ORDER BY ordinal_position SEPARATOR ' ') FROM information_schema.columns WHERE table_schema='se2026' AND table_name='user' AND column_name IN ('email','public_uid','bio','profile_visibility','created_at')")" \
            "user 表列顺序"
          echo "PATH_B_OK 存量升级路径通过"

      - name: 断言C——迁移幂等（重复回放不炸、数据不翻倍）
        run: |
          for f in deploy/mysql/migrations/*.sql; do mysql -h127.0.0.1 -uroot -f se2026 < "$f"; done
          q() { mysql -h127.0.0.1 -uroot -N -e "$1"; }
          [ "$(q "SELECT COUNT(*) FROM se2026.community_tag WHERE deleted=0")" = 8 ] \
            || { echo "::error::迁移重复执行后标签种子翻倍"; exit 1; }
          echo "PATH_C_OK 幂等通过"

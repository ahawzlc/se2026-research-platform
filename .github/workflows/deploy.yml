# ==============================================================================
# 自动部署：develop 分支推送后，把代码传到组服务器并重建容器
# ------------------------------------------------------------------------------
# 前提（一次性配置，见 docs/07-上线运维手册.md 第三节）：
#   在 GitHub 仓库 Settings → Secrets and variables → Actions 中添加：
#     DEPLOY_HOST         82.156.156.94
#     DEPLOY_PORT         22
#     DEPLOY_USER         ubuntu
#     DEPLOY_SSH_KEY      部署专用私钥（ed25519，公钥已加入服务器 authorized_keys）
#     DEPLOY_KNOWN_HOSTS  ssh-keyscan 得到的服务器 host key（防中间人）
#
# 说明：
#   - 2026-11-20（卡 T-0）：新增 test job —— 后端 lint/单测/e2e + 前端类型检查/lint，
#     作为 PR 与 develop 部署的双重门禁；PR 事件只跑测试、不触发部署
#   - 构建不在 runner 上做，只上传源码，镜像在服务器构建（避免重复拉 1GB 依赖）
#   - deploy/.env.prod 不入库，也不在压缩包内，服务器上的密钥永远不会被覆盖
#   - 同一时刻只允许一个部署任务，避免并发构建打架
# ==============================================================================

name: deploy

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与静态检查（PR / 部署门禁，卡 T-0）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22（与生产镜像 node:22-alpine 一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 后端依赖
        working-directory: backend
        run: npm ci

      - name: 后端 lint
        working-directory: backend
        run: npm run lint

      - name: 后端单测
        working-directory: backend
        run: npm test

      - name: 后端 e2e（HTTP 层验收）
        working-directory: backend
        run: npm run test:e2e

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 前端 F-2 页面回归
        working-directory: frontend
        run: npm test

      - name: 前端 lint
        working-directory: frontend
        run: npm run lint

  test-integration:
    name: 真库集成测试（卡 T-1a）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_PWD: root
      # 真库集成开关：未设 RUN_INTEGRATION 时套件整组跳过（schema-verify 环境同款 MySQL 容器）
      RUN_INTEGRATION: "1"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/se2026

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22（与生产镜像 node:22-alpine 一致）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 后端依赖
        working-directory: backend
        run: npm ci

      - name: 重放建库脚本（01-schema.sql，与 schema-verify 同口径）
        run: mysql -h127.0.0.1 -uroot < deploy/mysql/init/01-schema.sql

      - name: 运行真库集成测试（认证链 + 通知中心）
        working-directory: backend
        run: npm run test:integration

  deploy:
    name: 部署到组服务器
    needs: [test, test-integration]
    # PR 只跑测试不部署；push / 手动触发在 test 通过后才部署
    if: github.event_name != 'pull_request'
    # 串行化只约束部署本身，不阻塞 PR 的测试跑批
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检查部署密钥是否已配置
        id: guard
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::warning::未配置 DEPLOY_HOST 等 Secrets，本次跳过部署。配置方法见 docs/07-上线运维手册.md 第四节。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出代码
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 打包部署产物
        if: steps.guard.outputs.skip != 'true'
        run: |
          tar -czf "$RUNNER_TEMP/release.tgz" \
            --exclude='.git' \
            backend frontend deploy
          ls -lh "$RUNNER_TEMP/release.tgz"

      - name: 配置 SSH
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 上传产物
        if: steps.guard.outputs.skip != 'true'
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" \
            "$RUNNER_TEMP/release.tgz" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/release.tgz"

      - name: 解压并部署
        if: steps.guard.outputs.skip != 'true'
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "==> 解压到 /opt/se2026"
          tar -xzf /tmp/release.tgz -C /opt/se2026
          chmod +x /opt/se2026/deploy/scripts/*.sh
          echo "==> 执行部署脚本"
          APP_DIR=/opt/se2026 /opt/se2026/deploy/scripts/deploy.sh
          REMOTE

      - name: 公网健康检查
        if: steps.guard.outputs.skip != 'true'
        run: |
          for i in $(seq 1 6); do
            if curl -sf --max-time 5 "http://${{ secrets.DEPLOY_HOST }}/api/v1/health"; then
              echo ""
              echo "公网访问正常"
              exit 0
            fi
            sleep 5
          done
          echo "公网健康检查失败，请查看服务器容器日志"
          exit 1

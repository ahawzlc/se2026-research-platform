# ==============================================================================
# Nginx 反向代理配置（草稿，首次上线时再启用）
# ------------------------------------------------------------------------------
# 规划：前端构建产物由 Nginx 直接托管，/api 转发到后端服务。
# 后端服务名与端口在「后端技术选型定稿 + 首次上线」后确认，当前按 8080 占位。
# ==============================================================================

upstream se2026_backend {
    # 本地容器编排时使用服务名；若后端跑在宿主机，改为 host.docker.internal:8080
    server backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    client_max_body_size 50m;      # 与后端文件上传大小上限保持一致

    # ---------- 前端静态资源 ----------
    root  /usr/share/nginx/html;
    index index.html;

    # 单页应用：未命中的路由回退到 index.html，避免刷新 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass         http://se2026_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 轮询接口为高频短请求，适当放宽超时
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 上传文件的静态访问（若采用本地磁盘存储）----------
    location /uploads/ {
        alias      /data/uploads/;
        expires    7d;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}

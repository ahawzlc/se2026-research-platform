# ==============================================================================
# Nginx 生产配置（容器内使用，由 frontend/Dockerfile 复制进镜像）
# ------------------------------------------------------------------------------
# 拓扑：宿主机 80 → web 容器(Nginx 静态 + 反代) → backend:8080 → mysql:3306
# 说明：
#   - 前端构建产物由本容器直接托管，/api 反代到后端容器；
#   - 后端服务名 backend / 端口 8080 与 compose 中的服务名保持一致；
#   - 单页应用未命中的路由回退到 index.html，避免刷新 404。
# ==============================================================================

upstream se2026_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 50m;      # 与后端文件上传大小上限保持一致

    root  /usr/share/nginx/html;
    index index.html;

    # 压缩：Element Plus + 业务代码体积较大，gzip 后约减少 2/3
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    # ---------- 前端静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不可缓存，否则发版后浏览器仍走旧资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass         http://se2026_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 容器健康检查 ----------
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
